[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "serverless-cost-modeler"
version = "1.0.0"
description = "Turn a serverless invocation CSV into an itemised monthly bill, with what-if scenarios and a sensitivity curve."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "ABU BAKAR SIDDIQUE", email = "abs2003.edu@gmail.com" }]
keywords = ["serverless", "finops", "cost", "capacity", "cloud"]
dependencies = []

[project.scripts]
serverless-cost = "serverless_cost_modeler.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
